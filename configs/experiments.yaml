models:
  model1_optuna_top200_te:
    description: Optuna-tuned XGBoost on Top-200 collinearity-pruned features + Within-Fold
      Target Encoding
    feature_subset: top200_features
    use_within_fold_te: true
    early_stopping_rounds: 50
    xgb_params:
      objective: binary:logistic
      eval_metric: logloss
      tree_method: hist
      n_estimators: 800
      learning_rate: 0.02839085240935466
      max_depth: 4
      min_child_weight: 20
      subsample: 0.7941828192262391
      colsample_bytree: 0.6801081571939647
      reg_alpha: 0.009635630817019847
      reg_lambda: 0.45691781515976854
      random_state: 42
      n_jobs: 4
      colsample_bylevel: 0.6446367703145979
      gamma: 0.052323481257416274
    cv_results:
      experiment_id: model1_optuna_top200_te
      cv_mean_acc: 0.697
      cv_std_acc: 0.002168
      oof_accuracy: 0.697
      oof_roc_auc: 0.773848
      oof_log_loss: 0.566181
      train_mean_acc: 0.788625
      train_val_gap: 0.091625
      fold_val_accs:
      - 0.693
      - 0.6995
      - 0.6975
      - 0.698
      - 0.697
      fold_train_accs:
      - 0.799375
      - 0.791375
      - 0.802125
      - 0.77
      - 0.78025
      n_features: 212
      runtime_sec: 4.559
  model2_conservative_depth4_pruned_te:
    description: Conservative shallow (max_depth=4) heavily regularized XGBoost on
      all 512 pruned features + Within-Fold TE
    feature_subset: pruned_features
    use_within_fold_te: true
    early_stopping_rounds: 50
    xgb_params:
      objective: binary:logistic
      eval_metric: logloss
      tree_method: hist
      n_estimators: 550
      learning_rate: 0.03
      max_depth: 4
      min_child_weight: 15
      subsample: 0.75
      colsample_bytree: 0.45
      colsample_bylevel: 0.75
      gamma: 0.4
      reg_alpha: 1.5
      reg_lambda: 5.0
      n_jobs: 4
    cv_results:
